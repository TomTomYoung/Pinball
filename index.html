<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピンボールゲームエディター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        
        #phaser-container {
            position: relative;
            width: 70%;
            height: 100%;
            background-color: #111;
        }
        
        #properties-panel {
            width: 30%;
            height: 100%;
            background-color: #333;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        button {
            padding: 8px 16px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        button:hover {
            background-color: #666;
        }
        
        .object-list {
            margin-bottom: 20px;
        }
        
        .property-group {
            margin-bottom: 20px;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
        }
        
        .property-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .property-label {
            flex: 1;
        }
        
        .property-input {
            flex: 1;
            min-width: 0;
            width: 55%;
            box-sizing: border-box;
            background-color: #444;
            border: 1px solid #555;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
        }
        
        select.property-input {
            width: 100%;
        }
        
        h3 {
            margin-top: 0;
            border-bottom: 1px solid #666;
            padding-bottom: 8px;
        }
        
        #game-over {
            position: absolute;
            display: none;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            top: 0;
            left: 0;
        }
        
        #control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        #phaser-stage { position: absolute; inset: 60px 0 0; overflow: hidden; }
        #phaser-stage canvas { display: block; touch-action: none; }
        #control-panel { left: 10px; right: auto; flex-wrap: wrap; }
        #status-message { font-size: 14px; line-height: 1.5; min-height: 3em; }
        #status-message.error { color: #ffb4a8; }
        .help { color: #bbbbbb; font-size: 13px; }
        button:disabled { cursor: default; opacity: 0.45; }
        @media (max-width: 720px) {
            #game-container { flex-direction: column; }
            #phaser-container { width: 100%; height: 60%; }
            #properties-panel { width: 100%; height: 40%; }
            #control-panel { gap: 5px; }
            #control-panel button { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="phaser-container">
            <div id="phaser-stage"></div>
            <div id="control-panel">
                <button id="test-button">テストプレイ</button>
                <button id="stop-button" style="display: none;">エディターに戻る</button>
                <button id="save-button">保存</button>
                <button id="load-button">読込</button>
            </div>
            <div id="game-over">
                <h2>Game Over</h2>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-button">もう一度</button>
                <button id="edit-button">エディットに戻る</button>
            </div>
        </div>
        <div id="properties-panel">
            <h2>ピンボールエディター</h2>
            <p id="status-message" role="status" aria-live="polite">読み込み中…</p>
            <p class="help">操作：左矢印 / Z、右矢印 / スラッシュ</p>
            
            <div class="property-group">
                <h3>新規オブジェクト</h3>
                <button id="add-wall-button">壁を追加</button>
                <button id="add-bumper-button">バンパーを追加</button>
                <button id="add-flipper-button">フリッパーを追加</button>
                <button id="add-ball-button">ボール追加位置</button>
            </div>
            
            <div class="property-group object-list">
                <h3>オブジェクト一覧</h3>
                <select id="object-select" size="5" class="property-input">
                    <!-- オブジェクトリストがここに入ります -->
                </select>
                <button id="delete-object-button">選択オブジェクトを削除</button>
            </div>
            
            <div id="object-properties" class="property-group">
                <h3>プロパティ</h3>
                <div id="properties-form">
                    <!-- 選択されたオブジェクトのプロパティがここに表示されます -->
                    <p>オブジェクトを選択してください</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        const DEFAULT_BOARD = Object.freeze({ width: 800, height: 1000 });
        const STORAGE_KEY = 'pinballLayout';
        const LEGACY_BACKUP_KEY = 'pinballLayoutLegacyBackup';
        const $ = id => document.getElementById(id);

        // 保存・UI・プレイ開始で共通の検証を通す。現在の盤面は検証後に置換する。
        class LayoutCodec {
            static number(value, fallback, name, min = -100000, max = 100000) {
                const result = value === undefined ? fallback : value;
                if (typeof result !== 'number' || !Number.isFinite(result) || result < min || result > max) {
                    throw new Error(`${name}は${min}～${max}の数値で指定してください。`);
                }
                return result === 0 ? 0 : result;
            }

            static boolean(value, fallback, name) {
                if (value === undefined) return fallback;
                if (typeof value !== 'boolean') throw new Error(`${name}が不正です。`);
                return value;
            }

            static board(data = DEFAULT_BOARD) {
                if (!data || typeof data !== 'object') throw new Error('盤面サイズが不正です。');
                return {
                    width: this.number(data.width, undefined, '盤面の幅', 200, 10000),
                    height: this.number(data.height, undefined, '盤面の高さ', 200, 10000)
                };
            }

            static object(data) {
                if (!data || typeof data !== 'object' || !['wall', 'bumper', 'flipper', 'ball'].includes(data.type)) {
                    throw new Error('未対応のオブジェクトが含まれています。');
                }
                const defaults = {
                    wall: { color: '#888888', restitution: 0.7 },
                    bumper: { color: '#00aaff', restitution: 1.5 },
                    flipper: { color: '#ff0000', restitution: 0.8 },
                    ball: { color: '#ffffff', restitution: 0.8 }
                }[data.type];
                const color = data.color === undefined ? defaults.color : data.color;
                if (typeof color !== 'string' || !/^#[0-9a-f]{6}$/i.test(color)) throw new Error('色が不正です。');
                const name = data.name === undefined ? data.type : data.name;
                if (typeof name !== 'string' || name.length > 200) throw new Error('名前は200文字以内で指定してください。');
                const result = {
                    type: data.type,
                    x: this.number(data.x, undefined, 'X位置'),
                    y: this.number(data.y, undefined, 'Y位置'),
                    width: this.number(data.width, data.radius === undefined ? undefined : data.radius * 2, '幅', 1, 10000),
                    height: this.number(data.height, data.radius === undefined ? undefined : data.radius * 2, '高さ', 1, 10000),
                    angle: this.number(data.angle, 0, '角度', -180, 180),
                    name, color,
                    restitution: this.number(data.restitution, defaults.restitution, '反発係数', 0, 2)
                };
                if (data.type === 'wall') result.isStatic = this.boolean(data.isStatic, true, '固定状態');
                if (data.type === 'bumper' || data.type === 'ball') {
                    result.radius = this.number(data.radius, result.width / 2, '半径', 0.5, 5000);
                    result.width = result.height = result.radius * 2;
                }
                if (data.type === 'bumper') result.score = this.number(data.score, 50, 'スコア', 0, 1000000);
                if (data.type === 'flipper') {
                    result.isLeft = this.boolean(data.isLeft, true, '左右');
                    result.restAngle = this.number(data.restAngle, 0, '初期角度', -180, 180);
                    result.flipAngle = this.number(data.flipAngle, result.isLeft ? -45 : 45, 'フリップ角度', -180, 180);
                }
                if (data.type === 'ball') {
                    result.isBallPositionMarker = this.boolean(data.isBallPositionMarker, true, '開始位置');
                    if (!result.isBallPositionMarker) throw new Error('配置データのボールは開始位置マーカーにしてください。');
                    result.friction = this.number(data.friction, 0.005, '摩擦係数', 0, 1);
                }
                return result;
            }

            static normalize(data, fallbackBoard = DEFAULT_BOARD) {
                if (!data || typeof data !== 'object' || !Array.isArray(data.objects)) throw new Error('objects配列がありません。');
                if (data.schemaVersion !== undefined && data.schemaVersion !== 1) throw new Error('未対応の保存バージョンです。');
                if (data.objects.length > 1000) throw new Error('オブジェクトは1000個までです。');
                const objects = data.objects.map(item => this.object(item));
                if (objects.filter(item => item.type === 'ball').length > 1) throw new Error('開始位置マーカーは1個にしてください。');
                const board = data.schemaVersion === 1 ? data.board : fallbackBoard;
                if (!board) throw new Error('盤面サイズがありません。');
                return { schemaVersion: 1, board: this.board(board), objects };
            }

            // 旧コードが先頭に自動生成した3壁だけを候補とする。削除は画面で選択してもらう。
            static legacyBoundaryBoard(data) {
                if (data.schemaVersion !== undefined || !Array.isArray(data.objects) || data.objects.length < 3) return null;
                const [left, right, top] = data.objects;
                if (![left, right, top].every(o => o && o.type === 'wall' && o.isStatic === true && o.angle === 0)) return null;
                const width = top.width, height = left.height;
                if (left.name !== '左壁' || right.name !== '右壁' || top.name !== '上壁' ||
                    left.x !== 5 || left.y !== height / 2 || left.width !== 10 ||
                    right.x !== width - 5 || right.y !== height / 2 || right.width !== 10 || right.height !== height ||
                    top.x !== width / 2 || top.y !== 5 || top.height !== 10) return null;
                return this.board({ width, height });
            }
        }

        class PinballGame {
            constructor() {
                this.mode = 'loading';
                this.layoutData = null;
                this.board = { ...DEFAULT_BOARD };
                this.editor = new EditorScene(this);
                this.play = new GameScene(this);
                this.setupUIEvents();
                this.setMode('loading');
                this.game = new Phaser.Game({
                    type: Phaser.AUTO,
                    parent: 'phaser-stage',
                    width: this.board.width, height: this.board.height,
                    backgroundColor: '#111111',
                    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
                    physics: { default: 'matter', matter: { gravity: { y: 1 }, debug: false } },
                    scene: [this.editor, this.play]
                });
                // ペインの高さ変更も含め、盤面座標は変えずに表示だけを追従させる。
                if (typeof ResizeObserver !== 'undefined') {
                    this.resizeObserver = new ResizeObserver(() => {
                        if (this.mode !== 'loading' && this.game?.canvas) this.game.scale.refresh();
                    });
                    this.resizeObserver.observe($('phaser-stage'));
                }
            }

            setupUIEvents() {
                $('test-button').addEventListener('click', () => this.startGame());
                $('stop-button').addEventListener('click', () => this.stopGame());
                $('save-button').addEventListener('click', () => this.editor.saveLayout());
                $('load-button').addEventListener('click', () => this.editor.loadLayout());
                $('restart-button').addEventListener('click', () => this.restartGame());
                $('edit-button').addEventListener('click', () => this.stopGame());
            }

            notify(message, error = false) {
                $('status-message').textContent = message;
                $('status-message').classList.toggle('error', error);
            }

            setMode(mode) {
                this.mode = mode;
                const editing = mode === 'edit';
                const playing = mode === 'play' || mode === 'over';
                for (const id of ['test-button', 'save-button', 'load-button']) {
                    $(id).style.display = editing || mode === 'loading' ? '' : 'none';
                    $(id).disabled = !editing;
                }
                $('stop-button').style.display = playing ? '' : 'none';
                $('properties-panel').inert = !editing;
                $('properties-panel').style.opacity = editing ? '1' : '0.5';
                $('game-over').style.display = mode === 'over' ? 'flex' : 'none';
                $('restart-button').disabled = mode !== 'over';
            }

            setBoard(board) {
                this.board = { ...board };
                this.game.scale.setGameSize(board.width, board.height);
            }

            getEditorScene() { return this.editor; }
            getGameScene() { return this.play; }

            startGame() {
                if (this.mode !== 'edit') return;
                try {
                    this.layoutData = LayoutCodec.normalize(this.editor.getLayoutData());
                    this.editor.handlePointerUp();
                    this.setMode('starting');
                    this.editor.scene.sleep();
                    this.editor.scene.launch('GameScene', { layoutData: this.layoutData });
                } catch (error) {
                    this.setMode('edit');
                    this.notify(error.message, true);
                }
            }

            stopGame() {
                if (this.mode !== 'play' && this.mode !== 'over') return;
                this.setMode('returning');
                this.play.scene.stop();
                this.play.scene.wake('EditorScene');
            }

            restartGame() {
                if (this.mode !== 'over') return;
                this.setMode('starting');
                this.play.scene.restart({ layoutData: this.layoutData });
            }

            showGameOver(score) {
                $('final-score').textContent = score;
                this.setMode('over');
            }
        }

        class GameObject {
            constructor(scene, x, y, width, height, options = {}) {
                this.scene = scene;
                this.matter = scene.matter;
                Object.assign(this, { x, y, width, height });
                this.angle = options.angle ?? 0;
                this.name = options.name ?? this.constructor.name;
                this.restitution = options.restitution ?? 0.7;
                this.color = options.color ?? '#888888';
                this.isBoundary = options.isBoundary === true;
                this.gameObject = null;
                this.bodySize = null;
                // 派生クラスの全属性が確定してからcreateGameObjectを呼ぶ。
            }

            bodyOptions() { return { isStatic: true, restitution: this.restitution }; }
            shape() { return { type: 'rectangle', width: this.width, height: this.height }; }
            bodyPosition() { return { x: this.x, y: this.y }; }
            displayAngle() { return this.angle; }

            createGameObject() {
                this.gameObject = this.scene.add.rectangle(this.x, this.y, this.width, this.height, 0xffffff);
                this.finishCreation();
            }

            finishCreation() {
                try {
                    if (!this.isBallPositionMarker) {
                        this.matter.add.gameObject(this.gameObject, { ...this.bodyOptions(), shape: this.shape() });
                        this.bodySize = [this.width, this.height];
                    } else {
                        this.gameObject.setAlpha(0.5);
                    }
                    this.gameObject.userData = this;
                    this.updateProperties();
                } catch (error) { this.destroy(); throw error; }
            }

            updateProperties() {
                if (!this.gameObject) return;
                const go = this.gameObject;
                if (this.type === 'bumper' || this.type === 'ball') {
                    this.width = this.height = this.radius * 2;
                    if (go.radius !== this.radius) go.setRadius(this.radius);
                } else if (go.width !== this.width || go.height !== this.height) {
                    go.setSize(this.width, this.height);
                }
                if (go.body && (!this.bodySize || this.bodySize[0] !== this.width || this.bodySize[1] !== this.height)) {
                    this.removeHinge();
                    go.setBody(this.shape(), this.bodyOptions());
                    this.bodySize = [this.width, this.height];
                }
                const position = this.bodyPosition();
                go.setPosition(position.x, position.y);
                go.setAngle(this.displayAngle());
                go.setFillStyle(Phaser.Display.Color.ValueToColor(this.color).color);
                if (go.body) {
                    go.body.restitution = this.restitution;
                    if (this.friction !== undefined) go.setFriction(this.friction);
                }
            }

            removeHinge() {}
            setPosition(x, y) { this.x = x; this.y = y; this.updateProperties(); }
            setSelected(selected) { this.gameObject?.setStrokeStyle(selected ? 2 : 0, 0xffff00); }

            contains(x, y) {
                const position = this.bodyPosition();
                const angle = -this.displayAngle() * Math.PI / 180;
                const dx = x - position.x, dy = y - position.y;
                const localX = dx * Math.cos(angle) - dy * Math.sin(angle);
                const localY = dx * Math.sin(angle) + dy * Math.cos(angle);
                if (this.type === 'ball' || this.type === 'bumper') return Math.hypot(localX, localY) <= this.radius;
                return Math.abs(localX) <= this.width / 2 && Math.abs(localY) <= this.height / 2;
            }

            destroy() {
                this.removeHinge();
                if (this.gameObject) {
                    this.gameObject.userData = null;
                    this.gameObject.destroy();
                    this.gameObject = null;
                }
            }

            serialize() {
                return {
                    type: this.type, x: this.x, y: this.y, width: this.width, height: this.height,
                    angle: this.angle, name: this.name, restitution: this.restitution, color: this.color
                };
            }

            static deserialize(scene, data) {
                switch (data.type) {
                    case 'wall': return new Wall(scene, data.x, data.y, data.width, data.height, data);
                    case 'bumper': return new Bumper(scene, data.x, data.y, data.radius * 2, data);
                    case 'flipper': return new Flipper(scene, data.x, data.y, data.width, data.height, data);
                    case 'ball': return new Ball(scene, data.x, data.y, data.radius, data);
                    default: throw new Error(`未対応の種類: ${data.type}`);
                }
            }
        }

        class Wall extends GameObject {
            constructor(scene, x, y, width, height, options = {}) {
                super(scene, x, y, width, height, options);
                this.type = 'wall';
                this.isStatic = options.isStatic ?? true;
                this.createGameObject();
            }
            bodyOptions() { return { isStatic: this.isStatic, restitution: this.restitution }; }
            serialize() { return { ...super.serialize(), isStatic: this.isStatic }; }
        }

        class Bumper extends GameObject {
            constructor(scene, x, y, diameter, options = {}) {
                super(scene, x, y, diameter, diameter, { color: '#00aaff', restitution: 1.5, ...options });
                this.type = 'bumper';
                this.radius = diameter / 2;
                this.score = options.score ?? 50;
                this.createGameObject();
            }
            createGameObject() {
                this.gameObject = this.scene.add.circle(this.x, this.y, this.radius, 0xffffff);
                this.finishCreation();
            }
            shape() { return { type: 'circle', radius: this.radius }; }
            flash() {
                this.flashTimer?.remove();
                this.gameObject?.setFillStyle(0xffff00);
                this.flashTimer = this.scene.time.delayedCall(100, () => {
                    this.gameObject?.setFillStyle(Phaser.Display.Color.ValueToColor(this.color).color);
                });
            }
            destroy() { this.flashTimer?.remove(); super.destroy(); }
            serialize() { return { ...super.serialize(), radius: this.radius, score: this.score }; }
        }

        class Flipper extends GameObject {
            constructor(scene, x, y, width, height, options = {}) {
                super(scene, x, y, width, height, { color: '#ff0000', restitution: 0.8, ...options });
                this.type = 'flipper';
                this.isLeft = options.isLeft ?? true;
                this.restAngle = options.restAngle ?? 0;
                this.flipAngle = options.flipAngle ?? (this.isLeft ? -45 : 45);
                this.isFlipping = false;
                this.hinge = null;
                this.createGameObject();
            }
            bodyOptions() {
                return { isStatic: !this.scene.isPlaying, ignoreGravity: true, frictionAir: 0.05,
                    density: 0.01, restitution: this.restitution };
            }
            displayAngle() { return this.restAngle; }
            bodyPosition() {
                const offset = (this.isLeft ? 1 : -1) * this.width / 2;
                const angle = this.restAngle * Math.PI / 180;
                return { x: this.x + offset * Math.cos(angle), y: this.y + offset * Math.sin(angle) };
            }
            updateProperties() {
                this.removeHinge();
                super.updateProperties();
                const body = this.gameObject?.body;
                if (body && this.scene.isPlaying) {
                    // Constraint.createはpointBを「現在のワールド向き」で受け取る。
                    const offset = (this.isLeft ? -1 : 1) * this.width / 2;
                    const angle = body.angle;
                    this.hinge = this.matter.add.worldConstraint(body, 0, 1, {
                        pointA: { x: this.x, y: this.y },
                        pointB: { x: offset * Math.cos(angle), y: offset * Math.sin(angle) },
                        damping: 0.2
                    });
                    this.hingeWorld = this.matter.world;
                }
            }
            removeHinge() {
                if (this.hinge) { this.hingeWorld?.removeConstraint(this.hinge); this.hinge = null; this.hingeWorld = null; }
            }
            flip() { this.isFlipping = true; }
            reset() { this.isFlipping = false; }
            drive() {
                const body = this.gameObject?.body;
                if (!body || body.isStatic) return;
                // 3.60.0同梱MatterはignoreGravityを参照しないため、駆動部の重力だけ相殺する。
                const gravity = this.matter.world.engine.gravity;
                const gravityScale = gravity.scale ?? 0.001;
                body.force.x -= body.mass * gravity.x * gravityScale;
                body.force.y -= body.mass * gravity.y * gravityScale;
                const target = (this.isFlipping ? this.flipAngle : this.restAngle) * Math.PI / 180;
                const error = Math.atan2(Math.sin(target - body.angle), Math.cos(target - body.angle));
                this.matter.body.setAngularVelocity(body, Math.max(-0.25, Math.min(0.25, error * 0.45)));
            }
            serialize() {
                return { ...super.serialize(), isLeft: this.isLeft, restAngle: this.restAngle, flipAngle: this.flipAngle };
            }
        }

        class Ball extends GameObject {
            constructor(scene, x, y, radius, options = {}) {
                super(scene, x, y, radius * 2, radius * 2, { color: '#ffffff', restitution: 0.8, ...options });
                this.type = 'ball';
                this.radius = radius;
                this.friction = options.friction ?? 0.005;
                this.isBallPositionMarker = options.isBallPositionMarker ?? false;
                this.createGameObject();
            }
            createGameObject() {
                this.gameObject = this.scene.add.circle(this.x, this.y, this.radius, 0xffffff);
                this.finishCreation();
            }
            shape() { return { type: 'circle', radius: this.radius }; }
            bodyOptions() { return { isStatic: false, restitution: this.restitution, friction: this.friction, frictionAir: 0.001 }; }
            setVelocity(x, y) { if (this.gameObject?.body) this.gameObject.setVelocity(x, y); }
            serialize() {
                return { ...super.serialize(), radius: this.radius, friction: this.friction, isBallPositionMarker: this.isBallPositionMarker };
            }
        }

        function createBoundaries(scene, board) {
            const objects = [];
            try {
                for (const [x, y, width, height, name] of [
                    [5, board.height / 2, 10, board.height, '左壁'],
                    [board.width - 5, board.height / 2, 10, board.height, '右壁'],
                    [board.width / 2, 5, board.width, 10, '上壁']
                ]) objects.push(new Wall(scene, x, y, width, height, { name, isStatic: true, isBoundary: true }));
                return objects;
            } catch (error) { objects.forEach(object => object.destroy()); throw error; }
        }

        class EditorScene extends Phaser.Scene {
            constructor(app) {
                super({ key: 'EditorScene' });
                this.app = app;
                this.objects = [];
                this.selectedObject = null;
                this.isDragging = false;
                this.isPlaying = false;
                this.domListeners = [];
            }

            create() {
                this.app.game = this.game;
                this.board = { ...this.app.board };
                this.matter.world.pause();
                this.objects = createBoundaries(this, this.board);
                this.input.on('pointerdown', this.handlePointerDown, this);
                this.input.on('pointermove', this.handlePointerMove, this);
                this.input.on('pointerup', this.handlePointerUp, this);
                this.input.on('pointerupoutside', this.handlePointerUp, this);
                this.events.on('sleep', this.handlePointerUp, this);
                this.events.on('wake', this.onWake, this);
                this.events.once('shutdown', this.shutdown, this);
                this.setupUIEvents();
                this.updateObjectList();
                this.app.setMode('edit');
                this.app.notify('壁・バンパー・左右フリッパー・開始位置を配置できます。');
            }

            onWake() { this.handlePointerUp(); this.matter.world.pause(); this.app.setMode('edit'); }

            bind(id, event, handler) {
                const element = $(id);
                element.addEventListener(event, handler);
                this.domListeners.push(() => element.removeEventListener(event, handler));
            }

            setupUIEvents() {
                const add = factory => {
                    if (this.app.mode !== 'edit') return;
                    if (this.objects.filter(o => !o.isBoundary).length >= 1000) return this.app.notify('オブジェクトは1000個までです。', true);
                    const object = factory();
                    this.objects.push(object);
                    this.selectObject(object);
                };
                this.bind('add-wall-button', 'click', () => add(() => new Wall(this, 200, 200, 100, 20)));
                this.bind('add-bumper-button', 'click', () => add(() => new Bumper(this, 200, 200, 40)));
                this.bind('add-flipper-button', 'click', () => add(() => new Flipper(this, 150, this.board.height - 100, 100, 20)));
                this.bind('add-ball-button', 'click', () => {
                    if (this.app.mode !== 'edit') return;
                    const old = this.objects.find(o => o.type === 'ball');
                    if (old) { old.setPosition(200, 200); this.selectObject(old); }
                    else add(() => new Ball(this, 200, 200, 10, { isBallPositionMarker: true }));
                });
                this.bind('object-select', 'change', event => {
                    if (this.app.mode === 'edit') this.selectObject(this.objects[Number(event.target.value)] ?? null);
                });
                this.bind('delete-object-button', 'click', () => {
                    if (this.app.mode === 'edit' && this.selectedObject) this.removeObject(this.selectedObject);
                });
            }

            addObject(object) { this.objects.push(object); return object; }
            removeObject(object) {
                if (object.isBoundary) return;
                const index = this.objects.indexOf(object);
                if (index < 0) return;
                this.objects.splice(index, 1);
                object.destroy();
                if (this.selectedObject === object) this.selectObject(null);
                else this.updateObjectList();
            }
            selectObject(object) {
                if (object?.isBoundary) return;
                this.selectedObject?.setSelected(false);
                this.selectedObject = object;
                object?.setSelected(true);
                this.updateObjectList();
                this.updatePropertiesPanel();
            }
            handlePointerDown(pointer) {
                if (this.app.mode !== 'edit' || pointer.button !== 0 && pointer.button !== undefined) return;
                this.handlePointerUp();
                const object = [...this.objects].reverse().find(o => !o.isBoundary && o.contains(pointer.x, pointer.y));
                this.selectObject(object ?? null);
                if (object) {
                    this.isDragging = true;
                    this.dragOffsetX = pointer.x - object.x;
                    this.dragOffsetY = pointer.y - object.y;
                }
            }
            handlePointerMove(pointer) {
                if (!this.isDragging || !this.selectedObject) return;
                if (!pointer.isDown) return this.handlePointerUp();
                this.selectedObject.setPosition(
                    Math.max(0, Math.min(this.board.width, pointer.x - this.dragOffsetX)),
                    Math.max(0, Math.min(this.board.height, pointer.y - this.dragOffsetY))
                );
                this.updatePropertiesPanel();
                this.updateObjectList();
            }
            handlePointerUp() { this.isDragging = false; }
            updateObjectList() {
                const select = $('object-select');
                select.replaceChildren();
                this.objects.forEach((object, index) => {
                    if (object.isBoundary) return;
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${object.name || object.type} (${Math.round(object.x)}, ${Math.round(object.y)})`;
                    select.appendChild(option);
                });
                select.value = this.selectedObject ? String(this.objects.indexOf(this.selectedObject)) : '';
                $('delete-object-button').disabled = !this.selectedObject;
            }

            updatePropertiesPanel() {
                const form = $('properties-form');
                form.replaceChildren();
                const object = this.selectedObject;
                if (!object) { form.textContent = 'オブジェクトを選択してください'; return; }
                this.addPropertyField(form, 'name', '名前', object.name, 'text');
                this.addPropertyField(form, 'x', object.type === 'flipper' ? '支点X' : 'X位置', object.x, 'number');
                this.addPropertyField(form, 'y', object.type === 'flipper' ? '支点Y' : 'Y位置', object.y, 'number');
                if (object.type === 'ball' || object.type === 'bumper') {
                    this.addPropertyField(form, 'radius', '半径', object.radius, 'number', 0.5, 5000, 0.5);
                } else {
                    this.addPropertyField(form, 'width', '幅', object.width, 'number', 1, 10000);
                    this.addPropertyField(form, 'height', '高さ', object.height, 'number', 1, 10000);
                }
                if (object.type === 'wall') this.addPropertyField(form, 'angle', '角度', object.angle, 'number', -180, 180);
                this.addPropertyField(form, 'restitution', '反発係数', object.restitution, 'number', 0, 2, 0.1);
                this.addPropertyField(form, 'color', '色', object.color, 'color');
                if (object.type === 'bumper') this.addPropertyField(form, 'score', 'スコア', object.score, 'number', 0, 1000000);
                if (object.type === 'ball') this.addPropertyField(form, 'friction', '摩擦係数', object.friction, 'number', 0, 1, 0.001);
                if (object.type === 'flipper') {
                    this.addPropertyField(form, 'restAngle', '初期角度', object.restAngle, 'number', -180, 180);
                    this.addPropertyField(form, 'flipAngle', 'フリップ角度', object.flipAngle, 'number', -180, 180);
                    const label = document.createElement('label');
                    label.className = 'property-row';
                    label.textContent = '左/右';
                    const select = document.createElement('select');
                    select.name = 'isLeft'; select.className = 'property-input';
                    for (const [value, text] of [['true', '左'], ['false', '右']]) {
                        const option = document.createElement('option');
                        option.value = value; option.textContent = text; select.appendChild(option);
                    }
                    select.value = String(object.isLeft);
                    select.addEventListener('change', () => {
                        const isLeft = select.value === 'true';
                        // 左右の変更時は初期角度を中心にフリップ方向も反転する。
                        this.applyEdit(object, { isLeft, flipAngle: -object.flipAngle, restAngle: -object.restAngle });
                        this.updatePropertiesPanel();
                    });
                    label.appendChild(select); form.appendChild(label);
                }
            }

            addPropertyField(form, property, labelText, value, type, min = null, max = null, step = null) {
                const label = document.createElement('label');
                label.className = 'property-row';
                const text = document.createElement('span');
                text.className = 'property-label'; text.textContent = labelText;
                const input = document.createElement('input');
                input.className = 'property-input'; input.name = property; input.type = type; input.value = value;
                if (type === 'number') input.step = step ?? 'any';
                if (min !== null) input.min = min;
                if (max !== null) input.max = max;
                if (type === 'text') input.maxLength = 200;
                input.addEventListener('change', () => {
                    const object = this.selectedObject;
                    if (!object) return;
                    const newValue = type === 'number' ? input.valueAsNumber : input.value;
                    if (!this.applyEdit(object, { [property]: newValue })) input.value = object[property];
                });
                label.appendChild(text); label.appendChild(input); form.appendChild(label);
            }

            applyEdit(object, changes) {
                if (this.app.mode !== 'edit') return false;
                try {
                    const data = LayoutCodec.object({ ...object.serialize(), ...changes });
                    Object.assign(object, data);
                    object.updateProperties();
                    this.updateObjectList();
                    this.app.notify('変更しました。保存ボタンで保存できます。');
                    return true;
                } catch (error) { this.app.notify(error.message, true); return false; }
            }

            getLayoutData() {
                return { schemaVersion: 1, board: { ...this.board },
                    objects: this.objects.filter(object => !object.isBoundary).map(object => object.serialize()) };
            }

            saveLayout() {
                if (this.app.mode !== 'edit') return;
                try {
                    const layout = LayoutCodec.normalize(this.getLayoutData());
                    const previous = localStorage.getItem(STORAGE_KEY);
                    if (previous && localStorage.getItem(LEGACY_BACKUP_KEY) === null) {
                        let legacy = false;
                        try { legacy = JSON.parse(previous)?.schemaVersion === undefined; } catch (_) { /* 不正な旧データも保全する */ legacy = true; }
                        if (legacy) localStorage.setItem(LEGACY_BACKUP_KEY, previous);
                    }
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(layout, null, 2));
                    this.app.notify('レイアウトを保存しました。');
                } catch (error) { this.app.notify(`保存できませんでした。${error.message}`, true); }
            }

            loadLayout() {
                if (this.app.mode !== 'edit') return;
                try {
                    const text = localStorage.getItem(STORAGE_KEY);
                    if (!text) { this.app.notify('保存されたレイアウトがありません。'); return; }
                    const raw = JSON.parse(text);
                    const legacyBoard = LayoutCodec.legacyBoundaryBoard(raw);
                    const layout = LayoutCodec.normalize(raw, legacyBoard ?? this.board);
                    let keptLegacyWalls = false;
                    if (legacyBoard) {
                        if (confirm('旧形式の先頭3枚は外周壁の形状です。固定外周に置き換えますか？\nキャンセルを選ぶと3枚とも編集可能な壁として保持します。')) layout.objects.splice(0, 3);
                        else keptLegacyWalls = true;
                    }
                    this.replaceLayout(layout);
                    this.app.notify(keptLegacyWalls ? '読み込みました。旧外周の3枚は通常の壁として残しています。' : 'レイアウトを読み込みました。');
                } catch (error) { this.app.notify(`読み込みに失敗しました。${error.message}`, true); }
            }

            replaceLayout(data) {
                const layout = LayoutCodec.normalize(data);
                const staged = [];
                try {
                    staged.push(...createBoundaries(this, layout.board));
                    for (const record of layout.objects) staged.push(GameObject.deserialize(this, record));
                } catch (error) { staged.forEach(object => object.destroy()); throw error; }
                const previous = this.objects;
                this.handlePointerUp();
                this.selectedObject = null;
                this.objects = staged;
                this.board = { ...layout.board };
                previous.forEach(object => object.destroy());
                this.app.setBoard(this.board);
                this.updateObjectList();
                this.updatePropertiesPanel();
            }

            shutdown() {
                this.handlePointerUp();
                this.domListeners.forEach(unbind => unbind()); this.domListeners = [];
                this.events.off('wake', this.onWake, this);
                this.events.off('sleep', this.handlePointerUp, this);
                this.input.off('pointerdown', this.handlePointerDown, this);
                this.input.off('pointermove', this.handlePointerMove, this);
                this.input.off('pointerup', this.handlePointerUp, this);
                this.input.off('pointerupoutside', this.handlePointerUp, this);
                this.objects.forEach(object => object.destroy()); this.objects = []; this.selectedObject = null;
            }
        }

        class GameScene extends Phaser.Scene {
            constructor(app) { super({ key: 'GameScene' }); this.app = app; this.objects = []; }
            init(data) {
                this.layoutData = LayoutCodec.normalize(data.layoutData);
                this.board = { ...this.layoutData.board };
                this.objects = [];
                this.ball = null;
                this.score = 0;
                this.isGameOver = false;
                this.isPlaying = true;
            }
            create() {
                this.events.once('shutdown', this.shutdown, this);
                this.scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '24px', color: '#ffffff' }).setDepth(100);
                this.input.keyboard.enabled = true;
                this.input.keyboard.resetKeys();
                this.keys = this.input.keyboard.addKeys({ left: 'LEFT', right: 'RIGHT', z: 'Z', slash: 'FORWARD_SLASH' });
                this.matter.world.on('beforeupdate', this.beforePhysicsStep, this);
                this.matter.world.on('collisionstart', this.handleCollision, this);
                this.objects = createBoundaries(this, this.board);
                let marker = null;
                for (const record of this.layoutData.objects) {
                    if (record.type === 'ball') marker = record;
                    else this.objects.push(GameObject.deserialize(this, record));
                }
                this.ball = new Ball(this, marker?.x ?? this.board.width / 2, marker?.y ?? this.board.height / 3,
                    marker?.radius ?? 10, { ...(marker ?? {}), isBallPositionMarker: false });
                this.objects.push(this.ball);
                this.ball.setVelocity(Math.random() * 4 - 2, -5);
                this.matter.world.resume();
                this.app.setMode('play');
            }
            beforePhysicsStep() {
                if (this.isGameOver) return;
                for (const object of this.objects) {
                    if (object.type !== 'flipper') continue;
                    const down = object.isLeft ? this.keys.left.isDown || this.keys.z.isDown : this.keys.right.isDown || this.keys.slash.isDown;
                    if (down) object.flip(); else object.reset();
                    object.drive();
                }
            }
            update() {
                if (this.isGameOver) return;
                if (this.ball?.gameObject?.y > this.board.height + this.ball.radius + 50) this.gameOver();
            }
            handleCollision(event) {
                if (this.isGameOver || !this.ball?.gameObject) return;
                for (const { bodyA, bodyB } of event.pairs) {
                    const ball = this.ball.gameObject;
                    const other = bodyA.gameObject === ball ? bodyB : bodyB.gameObject === ball ? bodyA : null;
                    const object = other?.gameObject?.userData;
                    if (object?.type === 'bumper') { this.addScore(object.score); object.flash(); }
                    else if (object?.type === 'flipper' && object.isFlipping) this.addScore(10);
                }
            }
            addScore(points) {
                if (this.isGameOver) return;
                this.score += points;
                this.scoreText.setText(`Score: ${this.score}`);
            }
            gameOver() {
                if (this.isGameOver) return;
                this.isGameOver = true;
                this.ball?.setVelocity(0, 0);
                this.matter.world.pause();
                this.input.keyboard.resetKeys();
                this.input.keyboard.enabled = false;
                this.app.showGameOver(this.score);
            }
            shutdown() {
                this.matter.world?.off('beforeupdate', this.beforePhysicsStep, this);
                this.matter.world?.off('collisionstart', this.handleCollision, this);
                this.objects.forEach(object => object.destroy());
                this.objects = []; this.ball = null; this.isPlaying = false;
            }
        }

        const pinballGame = new PinballGame();
    </script>
